<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffd6e8" />
    <title>Sakura Island</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="petals" id="petals" aria-hidden="true"></div>

    <!-- top bar ------------------------------------------------------ -->
    <header class="topbar" id="topbar" hidden>
      <button class="chip chip-btn" id="btn-home" title="Island">
        <span>🏝️</span>
      </button>
      <div class="chip" id="bells-chip">
        <span class="chip-icon">🔔</span>
        <span id="bells-amount">0</span>
      </div>
      <div class="topbar-spacer"></div>
      <button class="chip chip-btn" id="btn-passport"><span>📕</span></button>
      <button class="chip chip-btn" id="btn-sound">
        <span id="sound-icon">🔊</span>
      </button>
    </header>

    <main id="app">
      <!-- title -------------------------------------------------------- -->
      <section class="screen screen-title active" id="screen-title">
        <div class="title-card">
          <div class="title-emoji">🌸</div>
          <h1 id="t-title">Sakura Island</h1>
          <p class="title-sub" id="t-subtitle">A Birthday Adventure</p>
          <p class="title-hello" id="t-hello"></p>
          <button class="btn btn-big" id="btn-start"></button>
          <div class="title-row">
            <button class="btn btn-ghost btn-small" id="btn-lang">FR</button>
            <button class="btn btn-ghost btn-small" id="btn-reset"></button>
          </div>
        </div>
      </section>

      <!-- island map --------------------------------------------------- -->
      <section class="screen screen-map" id="screen-map">
        <div class="island">
          <div class="island-sky">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
            <div class="sun"></div>
          </div>
          <div class="island-sea"></div>
          <div class="island-land">
            <div class="river-clip"><div class="river"></div></div>
            <div class="deco tree t1">🌳</div>
            <div class="deco tree t2">🌸</div>
            <div class="deco tree t3">🌲</div>
            <div class="deco flower f1">🌷</div>
            <div class="deco flower f2">🌼</div>
            <div class="deco flower f3">🌻</div>
            <div class="deco rock r1">🪨</div>

            <button class="spot" id="spot-bugs" style="--x: 24%; --y: 20%">
              <span class="spot-icon">🦋</span>
              <span class="spot-label"></span>
            </button>
            <button class="spot" id="spot-orchard" style="--x: 50%; --y: 18%">
              <span class="spot-icon">🍑</span>
              <span class="spot-label"></span>
            </button>
            <button class="spot" id="spot-fishing" style="--x: 76%; --y: 22%">
              <span class="spot-icon">🎣</span>
              <span class="spot-label"></span>
            </button>
            <button class="spot" id="spot-dig" style="--x: 15%; --y: 46%">
              <span class="spot-icon">🦴</span>
              <span class="spot-label"></span>
            </button>
            <button
              class="spot spot-shop"
              id="spot-shop"
              style="--x: 50%; --y: 45%"
            >
              <span class="spot-icon">🎁</span>
              <span class="spot-label"></span>
              <span class="badge" id="shop-badge" hidden>!</span>
            </button>
            <button class="spot" id="spot-rain" style="--x: 85%; --y: 46%">
              <span class="spot-icon">🌧️</span>
              <span class="spot-label"></span>
            </button>
            <button class="spot" id="spot-memory" style="--x: 26%; --y: 70%">
              <span class="spot-icon">☕</span>
              <span class="spot-label"></span>
            </button>
            <button class="spot" id="spot-concert" style="--x: 74%; --y: 70%">
              <span class="spot-icon">🎸</span>
              <span class="spot-label"></span>
            </button>
            <button
              class="spot spot-plaza"
              id="spot-plaza"
              style="--x: 50%; --y: 88%"
              hidden
            >
              <span class="spot-icon">🎆</span>
              <span class="spot-label"></span>
            </button>
          </div>
        </div>
        <p class="map-hint" id="map-hint"></p>
      </section>

      <!-- mini game ---------------------------------------------------- -->
      <section class="screen screen-game" id="screen-game">
        <div class="game-frame">
          <div class="game-hud">
            <button class="btn btn-ghost btn-small" id="btn-quit-game"></button>
            <h2 id="game-title"></h2>
            <div class="hud-stats" id="hud-stats"></div>
          </div>
          <div class="game-stage" id="game-stage"></div>
          <p class="game-hint" id="game-hint"></p>
        </div>
      </section>

      <!-- shop ---------------------------------------------------------- -->
      <section class="screen screen-shop" id="screen-shop">
        <div class="panel">
          <h2 id="shop-title"></h2>
          <p class="panel-sub" id="shop-intro"></p>
          <div class="gift-grid" id="gift-grid"></div>
          <p class="panel-foot" id="shop-foot"></p>
          <button class="btn" id="btn-shop-back"></button>
        </div>
      </section>

      <!-- passport ------------------------------------------------------ -->
      <section class="screen screen-passport" id="screen-passport">
        <div class="panel passport">
          <h2 id="passport-title"></h2>
          <p class="panel-sub" id="passport-sub"></p>
          <div class="stamp-grid" id="stamp-grid"></div>
          <div class="passport-totals" id="passport-totals"></div>
          <button class="btn" id="btn-passport-back"></button>
        </div>
      </section>

      <!-- finale --------------------------------------------------------- -->
      <section class="screen screen-finale" id="screen-finale">
        <div class="panel letter">
          <div class="letter-top">🎂</div>
          <h2 id="finale-title"></h2>
          <div class="slideshow" id="slideshow" hidden>
            <h3 class="slide-title" id="finale-memories-title"></h3>
            <div class="slide-frame" id="slide-frame"></div>
            <p class="slide-caption" id="slide-caption"></p>
            <div class="slide-dots" id="slide-dots"></div>
          </div>
          <div class="letter-body" id="letter-body"></div>
          <p class="letter-sign" id="letter-sign"></p>
          <button class="btn" id="btn-finale-back"></button>
        </div>
      </section>
    </main>

    <!-- dialogue bar ----------------------------------------------------- -->
    <div class="dialogue" id="dialogue" hidden>
      <div class="dialogue-box">
        <div class="dialogue-avatar" id="dialogue-avatar">🐱</div>
        <div class="dialogue-content">
          <div class="dialogue-name" id="dialogue-name">Coco</div>
          <p class="dialogue-text" id="dialogue-text"></p>
        </div>
        <span class="dialogue-next" id="dialogue-next">▼</span>
      </div>
    </div>

    <!-- modal ------------------------------------------------------------ -->
    <div class="modal-backdrop" id="modal" hidden>
      <div class="modal-card" id="modal-card"></div>
    </div>

    <canvas class="fx-canvas" id="fx-canvas" aria-hidden="true"></canvas>

    <script src="js/config.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/games/bugs.js"></script>
    <script src="js/games/fishing.js"></script>
    <script src="js/games/memory.js"></script>
    <script src="js/games/rain.js"></script>
    <script src="js/games/orchard.js"></script>
    <script src="js/games/dig.js"></script>
    <script src="js/games/concert.js"></script>
    <script src="js/gifts.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
